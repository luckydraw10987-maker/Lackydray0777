<!doctype html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lucky Draw Spinner</title><style>body{margin:0;background:#111424;color:#fff;font-family:Arial;padding:16px}.app{max-width:430px;margin:auto;background:#181b2d;border-radius:24px;padding:16px}h1{text-align:center;color:#ffd35a}.prize{text-align:center;padding:10px;background:#242840;border-radius:10px;color:#ffd35a;font-weight:bold}.controls{display:flex;gap:8px;margin:12px 0}select,button{padding:11px;border:0;border-radius:10px;font-weight:bold}select{flex:1}.wheel{position:relative;width:min(88vw,360px);aspect-ratio:1;margin:auto}.wheel canvas{width:100%;height:100%;border-radius:50%;border:10px solid #d9a92d}.pointer{position:absolute;z-index:2;left:50%;top:-8px;transform:translateX(-50%);border-left:16px solid transparent;border-right:16px solid transparent;border-top:36px solid red}.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:white;color:#111;border:6px solid #ffd35a;border-radius:50%;padding:16px;font-weight:bold}#spin{width:100%;margin:16px 0;background:#e8b735;font-size:19px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.panel{background:#242840;padding:12px;border-radius:14px}.panel h2{font-size:16px;color:#ffd35a}ol{padding-left:25px;max-height:240px;overflow:auto}.winner{text-align:center;background:#101322;color:#ffd35a;padding:12px;border-radius:10px;margin-top:12px}</style></head><body><div class="app"><h1>🎰 Lucky Draw Spinner</h1><div class="prize">প্রথম পুরস্কার: ৫০,০০০ টাকা</div><div class="controls"><select id="sel"></select><button onclick="setW()">Winner Set</button></div><div class="wheel"><div class="pointer"></div><canvas id="c" width="700" height="700"></canvas><div class="center">SPIN</div></div><button id="spin" onclick="spin()">▶ PLAY / SPIN</button><div class="grid"><div class="panel"><h2>🔢 Lucky Number</h2><ol id="nums"></ol></div><div class="panel"><h2>👤 ২০ জন</h2><ol id="names"></ol></div></div><div class="winner" id="res">Winner: —</div></div><script>const names=['Rahim','Karim','Hasan','Hossain','Sakib','Rakib','Nayeem','Rafi','Jahid','Imran','Shakil','Tanim','Fahim','Arif','Sohel','Rony','Sumon','Alamin','Milon','Rubel'];const c=document.getElementById('c'),x=c.getContext('2d'),sel=document.getElementById('sel');let ang=0,busy=false,target=0;names.forEach((n,i)=>{sel.add(new Option((i+1)+' - '+n,i));document.getElementById('nums').innerHTML+=`<li>${i+1}</li>`;document.getElementById('names').innerHTML+=`<li>${n}</li>`});function draw(){let N=20,s=2*Math.PI/N;x.clearRect(0,0,700,700);for(let i=0;i<N;i++){let a=ang+i*s;x.beginPath();x.moveTo(350,350);x.arc(350,350,335,a,a+s);x.closePath();x.fillStyle=['#e74c3c','#3498db','#2ecc71','#f1c40f','#9b59b6','#e67e22','#1abc9c','#e84393','#6c5ce7','#00b894'][i%10];x.fill();x.strokeStyle='#fff';x.stroke();x.save();x.translate(350,350);x.rotate(a+s/2);x.fillStyle='#fff';x.font='bold 25px Arial';x.textAlign='right';x.fillText(i+1,315,9);x.restore()}}function setW(){target=+sel.value;res.textContent='Selected: '+(target+1)+' - '+names[target]}function spin(){if(busy)return;busy=true;target=+sel.value;let N=20,s=2*Math.PI/N,desired=-Math.PI/2-(target*s+s/2),d=desired-ang;while(d<0)d+=2*Math.PI;d+=14*Math.PI;let st=ang,t0=performance.now();function f(t){let p=Math.min(1,(t-t0)/6000),e=1-Math.pow(1-p,4);ang=st+d*e;draw();if(p<1)requestAnimationFrame(f);else{ang=st+d;draw();busy=false;res.textContent='🏆 Winner: '+names[target]+' (Lucky Number '+(target+1)+')'}}requestAnimationFrame(f)}draw();</script></body></html>
